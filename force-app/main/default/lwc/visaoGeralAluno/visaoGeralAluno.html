<template>

    <template lwc:if={aluno}>
        <lightning-card icon-name="standard:account" variant="base">
        <div slot="title">Visão Geral do Aluno</div>
        <div class="slds-m-left_medium">

            <p class="slds-m-bottom_xx-small">
                <strong>Nome:</strong> {aluno.Name}
            </p>

            <p class="slds-m-bottom_xx-small">
                <strong>Curso:</strong> {cursoAluno}
            </p>
            
            <p class="slds-m-bottom_xx-small">
                <strong>Status: </strong> <span class={badgeTheme}>{aluno.Status__c}</span>
            </p>
        </div>
        </lightning-card>
    </template>

    <template lwc:elseif={error}>
        <div class="slds-p-around_medium">
                Ocorreu um erro ao carregar os dados do aluno.
        </div>
    </template>

</template>
